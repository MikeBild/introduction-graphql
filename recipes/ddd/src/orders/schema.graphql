enum OrderStatus {
  DRAFT
  PLACED
  PAID
  SHIPPED
  CANCELLED
}

"A value inside the order: no id of its own, reachable only through the root."
type OrderItem {
  productId: ID!
  quantity: Int!
  priceCents: Int!
}

"The root of the Order aggregate."
type Order {
  id: ID!
  status: OrderStatus!
  items: [OrderItem!]!
  totalCents: Int!
  customer: Customer!
}

# What the order context knows about a customer: who gets the invoice.
extend type Customer {
  name: String!
  email: String!
}

type OrderNotFound {
  message: String!
}

type OrderNotEditable {
  message: String!
}

type EmptyOrder {
  message: String!
}

input PlaceOrderInput {
  orderId: ID!
}

type PlaceOrderPayload {
  order: Order!
}

union PlaceOrderResult = PlaceOrderPayload | OrderNotFound | OrderNotEditable | EmptyOrder

input OrderItemInput {
  productId: ID!
  quantity: Int!
  priceCents: Int!
}

"Every field is optional, so nobody can tell which combination is allowed."
input UpdateOrderInput {
  orderId: ID!
  customerId: ID
  status: OrderStatus
  items: [OrderItemInput!]
}

type UpdateOrderPayload {
  order: Order!
}

union UpdateOrderResult = UpdateOrderPayload | OrderNotFound

extend type Query {
  order(id: ID!): Order
  "The read model of all orders that are not finished yet"
  openOrders: [Order!]!
}

extend type Mutation {
  placeOrder(input: PlaceOrderInput!): PlaceOrderResult!
  updateOrder(input: UpdateOrderInput!): UpdateOrderResult!
}
