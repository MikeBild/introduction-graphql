query OrderOverview($first: Int!) {
  open: orders(status: PLACED, first: $first) {
    ...OrderRow
  }
  paid: orders(status: PAID, first: $first) {
    ...OrderRow
  }
}

query OrderDetail($id: ID!, $withItems: Boolean!) {
  order(id: $id) {
    ...OrderRow
    items @include(if: $withItems) {
      product {
        name
      }
      quantity
    }
  }
}

fragment OrderRow on Order {
  id
  status
  totalCents
  customer {
    name
  }
}
