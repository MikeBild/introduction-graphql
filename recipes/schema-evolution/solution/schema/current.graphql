# Expand: totalPrice is added, total stays and is deprecated until nobody asks for it anymore.
type Order {
  id: ID!
  status: OrderStatus!
  "Total in whole cents"
  total: Int! @deprecated(reason: "Use totalPrice, it includes the currency.")
  totalPrice: Money!
  createdAt: String
}

"Money in whole cents plus currency – never a float"
type Money {
  amountCents: Int!
  currency: String!
}

enum OrderStatus {
  DRAFT
  PLACED
  PAID
  CANCELLED
}

input OrderItemInput {
  productId: ID!
  quantity: Int!
}

input PlaceOrderInput {
  items: [OrderItemInput!]!
  "new input fields must be optional"
  note: String
}

type Query {
  orders: [Order!]!
}

type Mutation {
  placeOrder(input: PlaceOrderInput!): Order!
}
