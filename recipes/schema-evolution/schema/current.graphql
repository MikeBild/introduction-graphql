# Your working copy. Change this file and run `npm run schema:diff`.
type Order {
  id: ID!
  status: OrderStatus!
  "Total in whole cents"
  total: Int!
  # new and optional: an additive change
  createdAt: String
}

enum OrderStatus {
  DRAFT
  PLACED
  PAID
  CANCELLED
}

input OrderItemInput {
  productId: ID!
  quantity: Int!
}

input PlaceOrderInput {
  items: [OrderItemInput!]!
}

type Query {
  orders: [Order!]!
}

type Mutation {
  placeOrder(input: PlaceOrderInput!): Order!
}
