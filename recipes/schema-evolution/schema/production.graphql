# The schema that is live in production (e.g. exported from the main branch).
type Order {
  id: ID!
  status: OrderStatus!
  "Total in whole cents"
  total: Int!
}

enum OrderStatus {
  DRAFT
  PLACED
  PAID
  CANCELLED
}

input OrderItemInput {
  productId: ID!
  quantity: Int!
}

input PlaceOrderInput {
  items: [OrderItemInput!]!
}

type Query {
  orders: [Order!]!
}

type Mutation {
  placeOrder(input: PlaceOrderInput!): Order!
}
