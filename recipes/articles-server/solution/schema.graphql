enum ArticleState {
  DRAFT
  PUBLISHED
}

"An article in the newsroom"
type Article {
  id: ID!
  title: String!
  content: String!
  state: ArticleState!
  authorId: ID!
  author: Author!
  "ISO 8601 timestamp"
  createdAt: String!
}

"Somebody who writes articles"
type Author {
  id: ID!
  name: String!
  "All articles of this author, newest first"
  articles: [Article!]!
}

type Query {
  articles: [Article!]!
  article(id: ID!): Article
  author(id: ID!): Author
}

input ArticleAddInput {
  title: String!
  content: String!
}

type ArticleAddPayload {
  article: Article!
}

input ArticlePublishInput {
  articleId: ID!
}

type ArticlePublishPayload {
  article: Article!
}

type Mutation {
  "Adds a draft for the signed-in author. Needs the header authorization: Bearer <token>"
  articleAdd(input: ArticleAddInput!): ArticleAddPayload!
  "Publishes a draft. Only the author of the article may do that."
  articlePublish(input: ArticlePublishInput!): ArticlePublishPayload!
}
