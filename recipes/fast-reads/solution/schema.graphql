"Lifecycle of an order: DRAFT → PLACED → PAID → SHIPPED; CANCELLED only from DRAFT or PLACED"
enum OrderStatus {
  DRAFT
  PLACED
  PAID
  SHIPPED
  CANCELLED
}

"A product of the workshop shop. Money is always in whole cents."
type Product {
  id: ID!
  name: String!
  priceCents: Int!
}

type OrderItem {
  quantity: Int!
  "Unit price at the time of ordering"
  priceCents: Int!
  "null when the product no longer exists"
  product: Product
}

type Order {
  id: ID!
  status: OrderStatus!
  "ISO 8601 timestamp"
  createdAt: String!
  items: [OrderItem!]!
  "Sum of quantity × priceCents"
  totalCents: Int!
}

type OrderEdge {
  node: Order!
  cursor: String!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type OrderConnection {
  edges: [OrderEdge!]!
  pageInfo: PageInfo!
}

type Query {
  "Newest first. Pass pageInfo.endCursor as after to get the next page. first is capped at 100."
  orders(first: Int = 20, after: String): OrderConnection!
}
